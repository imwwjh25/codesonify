name: CI - Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 缓存 Maven 依赖
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: 编译项目
        run: mvn clean compile -B

      - name: 运行单元测试
        run: mvn test -B

      - name: 运行集成测试
        run: mvn verify -DskipUnitTests -B

      - name: 生成测试报告
        if: always()
        run: mvn surefire-report:report -B

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: target/site/surefire-report.html
          retention-days: 7

      - name: 上传测试失败日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: target/surefire-reports/*.txt
          retention-days: 7